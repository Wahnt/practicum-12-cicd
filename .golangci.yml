version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gocritic
    - misspell
    - bodyclose
    - errorlint
    - nilerr

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
    staticcheck:
      checks:
        - all
        - -SA4006

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - ineffassign
